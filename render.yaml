services:
  - type: web
    name: be-qtrack
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: beqtrack-db
          property: connectionString

databases:
  - name: beqtrack-db
    plan: free
    databaseName: beqtrack
